[workspace]
resolver = "3"
members = ["crates/flokin-app", "crates/flokin-core"]
default-members = ["crates/flokin-app"]

[workspace.package]
edition = "2021"
version = "0.1.0-rc.3"
authors = ["FlokinMD contributors"]
license = "Apache-2.0"
repository = "https://github.com/sergiocardoso/flokin-md"
homepage = "https://sergiocardoso.dev"
description = "A local-first desktop workspace for understanding, querying and organizing Markdown as structured data."

[workspace.lints.rust]
unsafe_code = "forbid"
